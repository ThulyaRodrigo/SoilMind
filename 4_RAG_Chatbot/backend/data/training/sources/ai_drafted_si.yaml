    - {q: "කරල් ගෙල කළු වී කඩා වැටෙන්නේ ඇයි?", a: "එය කොළ පාළුව දිලීරය කරලේ ගෙලට ආසාදනය වීමයි (ගෙල කුණුවීම); එවිට ඇට පිරීම නවතී."}
    - {q: "කොළ පාළුව රෝගය ඇති කරන්නේ මොකක්ද?", a: "Magnaporthe grisea (Pyricularia grisea) නම් දිලීරයයි."}
