# A bounded crawl of RRDI's paddy knowledge pages (English and Sinhala versions; Tamil is out of scope).
# Starts at `seeds`, follows only links whose page slug matches `allow` and not `deny`, up to `max_pages`.
rrdi_knowledge_pages:
  publisher: Rice Research and Development Institute (RRDI), Department of Agriculture
  listed_on: https://doa.gov.lk/rrdi_homepage/
  kind: crawl
  max_pages: 260
  seeds:
    - rrdi_ricediseases
    - rrdi_ricediseases_si
    - rrdi_pests
    - rrdi_pests_si
    - rrdi_weed_intro
    - rrdi_weed_intro_si
    - rrdi_cropestablishment
    - rrdi_cropestablishment_si
    - rrdi_cropestablishment_landpreparation
    - rrdi_technology_agronomy_div
    - rrdi_technology_soilscience_div
    - rrdi_technology_watermanagement_div
    - rrdi_rice_varities
    - rrdi_rice_varities_si
    - rrdi_rice_introduction-2
  allow: '^rrdi_(ricediseases|pests|weed|cropestablishment|technology|rice_)'
  deny: '(_ta(-\d+)?$|_ta_|_div$|rrdi_rice_varities$)'
